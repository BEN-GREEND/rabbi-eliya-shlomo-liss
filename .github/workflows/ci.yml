name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Referential integrity first — it is the fastest check and the one
      # most likely to catch a content mistake.
      - run: npm run content:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
