  הרב אליהו שלמה ליס היה מן הדמויות התורניות הבולטות בחיפה ומראשי ישיבת
  תפארת ישראל. תלמידם של רבי איסר זלמן מלצר ורבי אהרן קוטלר, מתלמידי
  ישיבת חברון ומרביץ תורה במשך שנים רבות. אתר זה מבקש לאסוף ולשמר את
  תולדות חייו, תורתו, דמותו, תלמידיו ומורשתו לדורות.
